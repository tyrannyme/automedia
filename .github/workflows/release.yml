name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux
          - os: windows-2025
            name: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The tag is the version. package.json is not bumped per release.
      - name: Set version from tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not a vX.Y.Z version"
            exit 1
          fi
          npm pkg set "version=${version}"

      - name: Install
        run: pnpm install --frozen-lockfile

      # Linux finishes well before Windows, so checking there costs no time.
      - name: Check
        if: runner.os == 'Linux'
        run: pnpm check

      # Windows tests are skipped: node-av's prebuilt FFmpeg crashes on some
      # CPUs (e.g. AMD Zen 3) when exporting video with audio.
      - name: Test
        if: runner.os == 'Linux'
        run: pnpm test

      - name: Make
        run: pnpm make

      - uses: actions/upload-artifact@v4
        with:
          name: automedia-${{ matrix.name }}
          # latest*.yml and the blockmaps are what installed apps read to update.
          path: |
            out/make/*.AppImage
            out/make/*.exe
            out/make/*.blockmap
            out/make/latest*.yml
            out/make/zip/**/*.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          find artifacts -type f -print0 |
            xargs -0 gh release create "${GITHUB_REF_NAME}" \
              --title "Automedia ${GITHUB_REF_NAME}" \
              --generate-notes \
              --verify-tag \
              ${prerelease}
